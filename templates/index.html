
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather Now</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
<main class="container">

    <header class="header">
        <div class="logo">
    <h1>
        <img src="{{ url_for('static', filename='IMG/download.png') }}" alt="Logo" style="width: 32px; height: 32px; vertical-align: middle; margin-right: 8px; border-radius: 50%;"> 
        Weather Now
    </h1>
</div>

        <div class="settings-dropdown-container">
            <button id="units-btn" type="button">
                ⚙️ Unidades ▾
            </button>

            <div id="units-menu" class="units-menu hidden">
                <label for="temp-unit">Temperatura</label>
                <select id="temp-unit">
                    <option value="celsius">Celsius (°C)</option>
                    <option value="fahrenheit">Fahrenheit (°F)</option>
                </select>

                <label for="wind-unit">Velocidade do vento</label>
                <select id="wind-unit">
                    <option value="kmh">km/h</option>
                    <option value="mph">mph</option>
                </select>

                <label for="precip-unit">Precipitação</label>
                <select id="precip-unit">
                    <option value="mm">Milímetros (mm)</option>
                    <option value="inch">Polegadas (in)</option>
                </select>
            </div>
        </div>
    </header>

    <section class="search-section">
        <h2>Como estará o tempo hoje?</h2>

        <form id="search-form" class="search-box">
            <input
                id="city-input"
                type="text"
                placeholder="Pesquise uma cidade..."
                required
            >
            <button type="submit">Pesquisar</button>
        </form>

        <p id="error-message" role="alert"></p>
    </section>

    <div class="dashboard-grid">

        <section class="left-column">
            <div class="weather-panel">
                <div>
                    <h2 id="city-name">Brasília, Brasil</h2>
                    <p id="current-date">Carregando...</p>
                </div>

                <strong id="current-temp" class="temperature">
                    --°
                </strong>
            </div>

            <div class="metrics-grid">
                <article class="metric-card">
                    <span>Sensação térmica</span>
                    <strong id="feels-like">--°</strong>
                </article>

                <article class="metric-card">
                    <span>Umidade</span>
                    <strong id="humidity">--%</strong>
                </article>

                <article class="metric-card">
                    <span>Vento</span>
                    <strong id="wind-speed">-- km/h</strong>
                </article>

                <article class="metric-card">
                    <span>Precipitação</span>
                    <strong id="precipitation">-- mm</strong>
                </article>
            </div>

            <section>
                <h3>Previsão para 7 dias</h3>
                <div id="daily-list" class="daily-list">
                    Carregando previsão...
                </div>
            </section>
        </section>

        <section class="right-column">
            <div class="forecast-panel">
                <div class="forecast-header">
                    <h3>Previsão por hora</h3>
                    <select id="day-select" aria-label="Selecionar dia">
                        <option value="0">Hoje</option>
                    </select>
                </div>

                <div id="hourly-list" class="hourly-list">
                    Carregando previsão...
                </div>
            </div>
        </section>

    </div>
</main>

<script src="{{ url_for('static', filename='js/script.js') }}"
        defer></script>
</body>
</html>
